<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registración</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    
    <div class="container">
        <div class="container-form">
            <form class="sign-in">
                <h2>Iniciar sesión</h2>
                
                <div class="social-networks">
                    <i class="bi bi-twitch"></i>
                    <i class="bi bi-twitter-x"></i>
                    <i class="bi bi-instagram"></i>
                    <i class="bi bi-tiktok"></i>
                </div>
                
                <span>Use su correo y contraseña</span>
                
                <div class="container-input">
                    <i class="bi bi-envelope"></i>
                    <input type="mail" placeholder="corregoejemplo@gmail.com">
                </div>

                <div class="container-input">
                    <i class="bi bi-lock"></i>
                    <input type="password" placeholder="*********">
                </div>
                <a href="#">¿Olvidaste tu contraseña?</a>
                <button class="btn">INICIAR SESIÓN</button>

            </form>
        </div>

        <div class="container-form">
            <form class="sign-up">
                <h2>Registrarse</h2>

                <div class="social-networks">
                    <i class="bi bi-twitch"></i>
                    <i class="bi bi-twitter-x"></i>
                    <i class="bi bi-instagram"></i>
                    <i class="bi bi-tiktok"></i>
                </div>
                
                <span>Use su correo para registrarse</span>
                
                <div class="container-input">
                    <i class="bi bi-envelope"></i>
                    <input type="mail" placeholder="corregoejemplo@gmail.com">
                </div>

                <div class="container-input">
                    <i class="bi bi-lock"></i>
                    <input type="password" placeholder="*********">
                </div>

                <div class="container-input">
                    <i class="bi bi-person"></i>
                    <input type="text" placeholder="Nombre">
                </div>

                <button class="btn">REGISTRARSE</button>

            </form>
            
        </div>
        <div class="container-welcome">
            <div class="welcome-sign-up welcome">
                <h3>¡Bienvenido!</h3>
                <p>Ingrese sus datos personales para usar todas las funciones del sitio</p>
                <button class="btn" id="btn-sign-up">Registrarse</button>
            </div>
            <div class="welcome-sign-in welcome">
                <h3>¡Hola!</h3>
                <p>Regístrese con sus datos personales para usar todas las funcionalidades del sitio</p>
                <button class="btn" id="btn-sign-in">Iniciar sesión</button>
            </div>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>
