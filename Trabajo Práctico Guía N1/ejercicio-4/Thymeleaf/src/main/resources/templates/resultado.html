<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado Formulario</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg border-0 rounded-4"
         style="max-width: 700px; width: 100%;">

        <div class="card-body p-5">

            <!-- Título -->
            <h2 class="text-center mb-2 fw-bold text-primary">
                Datos procesados
            </h2>

            <p class="text-center text-muted mb-4">
                Estos son los datos ingresados en el formulario
            </p>

            <!-- Tabla -->
            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle text-center">

                    <thead class="table-primary">
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Edad</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr>
                        <td th:text="${persona.nombre}"></td>
                        <td th:text="${persona.apellido}"></td>
                        <td th:text="${persona.edad}"></td>
                    </tr>
                    </tbody>

                </table>

            </div>

            <!-- Resultado tipo de edad -->
            <div class="alert alert-info text-center mt-4 mb-0" role="alert">
                <strong th:text="${tipoEdad}"></strong>
            </div>

        </div>
    </div>

</div>

</body>
</html>
