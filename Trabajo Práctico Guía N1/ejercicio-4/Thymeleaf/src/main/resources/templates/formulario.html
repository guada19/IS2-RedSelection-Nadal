<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Thymeleaf</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg border-0 rounded-4" style="max-width: 500px; width: 100%;">

        <div class="card-body p-5">

            <h2 class="text-center mb-4 fw-bold text-primary">
                Ingreso de datos
            </h2>

            <p class="text-center text-muted mb-4">
                Completá tus datos para continuar
            </p>

            <form th:action="@{/procesar}" th:object="${persona}" method="post">

                <!-- Nombre -->
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-semibold">
                        Nombre
                    </label>

                    <input
                            th:field="*{nombre}"
                            type="text"
                            id="nombre"
                            class="form-control form-control-lg"
                            placeholder="Ingresá tu nombre"
                            required>
                </div>

                <!-- Apellido -->
                <div class="mb-3">
                    <label for="apellido" class="form-label fw-semibold">
                        Apellido
                    </label>

                    <input
                            th:field="*{apellido}"
                            type="text"
                            id="apellido"
                            class="form-control form-control-lg"
                            placeholder="Ingresá tu apellido"
                            required>
                </div>

                <!-- Edad -->
                <div class="mb-4">
                    <label for="edad" class="form-label fw-semibold">
                        Edad
                    </label>

                    <input
                            th:field="*{edad}"
                            type="number"
                            id="edad"
                            class="form-control form-control-lg"
                            placeholder="Ingresá tu edad"
                            min="1"
                            required>
                </div>

                <!-- Botón -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg rounded-3">
                        Enviar
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>


</body>
</html>
