<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inicio - Administrador 1.0</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{fragments :: header}"></div>

    <main class="container flex-grow-1 py-5">

        <div class="row justify-content-center">

            <div class="col-lg-9 col-xl-8">

                <!-- Tarjeta principal -->

                <div class="card border-0 shadow-lg rounded-4">

                    <div class="card-body p-5 text-center">

                        <!-- Icono -->

                        <div class="mb-4">

                            <div class="bg-primary text-white
                                            d-inline-flex align-items-center
                                            justify-content-center
                                            rounded-circle shadow-sm"
                                 style="width: 80px; height: 80px;">

                                    <span class="fs-1">
                                        📦
                                    </span>

                            </div>

                        </div>


                        <!-- Título -->

                        <h1 class="fw-bold text-dark mb-3">
                            Bienvenido al sistema
                        </h1>


                        <!-- Descripción -->

                        <p class="lead text-muted mb-4">
                            Administrá y consultá fácilmente el listado
                            de productos de tu aplicación.
                        </p>


                        <hr class="my-4">


                        <!-- Información -->

                        <div class="row g-4 mb-4">

                            <div class="col-md-6">

                                <div class="bg-light rounded-4 p-4 h-100">

                                    <h5 class="fw-bold text-primary">
                                        📋 Productos
                                    </h5>

                                    <p class="text-muted mb-0">
                                        Visualizá todos los productos
                                        registrados en el sistema.
                                    </p>

                                </div>

                            </div>


                            <div class="col-md-6">

                                <div class="bg-light rounded-4 p-4 h-100">

                                    <h5 class="fw-bold text-primary">
                                        🔄 Thymeleaf
                                    </h5>

                                    <p class="text-muted mb-0">
                                        La información se muestra
                                        dinámicamente utilizando Thymeleaf.
                                    </p>

                                </div>

                            </div>

                        </div>


                        <!-- Botón -->

                        <a th:href="@{/productos}"
                           class="btn btn-primary btn-lg px-5 py-3
                                      rounded-3 shadow-sm">

                            Ver listado de productos

                        </a>

                    </div>

                </div>


                <!-- Alerta -->

                <div class="mt-4">

                    <div th:replace="~{fragments :: alertaError}"></div>

                </div>

            </div>

        </div>

    </main>

    <div th:replace="~{fragments :: footer}"></div>
</body>

</html>
