<!DOCTYPE html>
<!--
    ============================================================================
    VISTA — login.html (la "V" de MVC)
    ============================================================================
    xmlns:th="http://www.thymeleaf.org" habilita el "dialecto" de atributos
    th:* que Thymeleaf procesa en el servidor ANTES de enviar el HTML final
    al navegador. A diferencia de un template puramente estático, esta
    plantilla puede:
      - Leer atributos que el Controller puso en el Model (${...}).
      - Enlazar (data binding) los <input> con el objeto LoginDTO (th:object
        / th:field), incluyendo el reenvío automático del valor tipeado si
        hay un error de validación.
      - Mostrar mensajes flash (${error}, ${mensaje}) que sobrevivieron a un
        redirect gracias a RedirectAttributes en el Controller.
    ============================================================================
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/head :: head('Iniciar sesión')}"></th:block>
<body>
<div class="auth-wrap">
    <!-- Fondos decorativos "aurora", tomados tal cual del template original -->
    <div class="aur aur-a" style="top:-80px;left:-120px"></div>
    <div class="aur aur-b" style="top:180px;right:-180px"></div>

    <div class="auth-card">
        <div class="auth-brand">
            <div class="logo-i"><i class="fa-solid fa-layer-group"></i></div>
            <span>NexusAI</span>
        </div>
        <div class="auth-title">Iniciar sesión</div>
        <div class="auth-subtitle">Ingrese con su correo personal y su clave</div>

        <!-- Mensaje de éxito, por ejemplo tras registrarse correctamente -->
        <div class="ok-msg" th:if="${mensaje}" th:text="${mensaje}"></div>

        <!-- Mensaje de error flash: credenciales inválidas, cuenta bloqueada, etc. -->
        <div class="err-msg" style="display:block" th:if="${error}">
            <i class="fa-solid fa-circle-exclamation me-1"></i>
            <span th:text="${error}"></span>
        </div>

        <!--
            th:action + th:object: el formulario postea a /login y sus campos
            se enlazan al objeto "loginForm" (una instancia de LoginDTO) que el
            Controller agregó al Model.
        -->
        <form th:action="@{/login}" th:object="${loginForm}" method="post">
            <label class="olbl"><i class="fa-regular fa-envelope me-1"></i>Correo personal</label>
            <input class="oinp" type="email" th:field="*{correoPersonal}" placeholder="nombre@correo.com" autocomplete="username">
            <span class="field-err" th:if="${#fields.hasErrors('correoPersonal')}" th:errors="*{correoPersonal}"></span>

            <label class="olbl"><i class="fa-solid fa-lock me-1"></i>Clave</label>
            <input class="oinp" type="password" th:field="*{clave}" placeholder="********" autocomplete="current-password">
            <span class="field-err" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></span>

            <button type="submit" class="bgrd btn w-100 py-3 fw-semibold fs-6 mt-2">
                Ingresar <i class="fa-solid fa-arrow-right ms-1 fa-sm"></i>
            </button>
        </form>

        <p class="text-center mt-4" style="font-size:.82rem;color:var(--tx3)">
            ¿No tiene una cuenta?
            <a th:href="@{/registro}" style="color:var(--pur)">Regístrese aquí</a>
        </p>
    </div>
</div>
</body>
</html>
