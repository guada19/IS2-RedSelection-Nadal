<!DOCTYPE html>
<!--
    ============================================================================
    VISTA — registro.html
    ============================================================================
    Formulario de alta de usuario. Se enlaza (th:object) contra el DTO
    RegistroUsuarioDTO. Cada campo usa th:field="*{atributo}", que Thymeleaf
    traduce automáticamente a los atributos id/name/value del <input>, y
    permite mostrar, junto a cada campo, sus errores puntuales de validación
    con th:errors, generados por las anotaciones @NotBlank/@Email/@Past/etc.
    del DTO cuando el Controller ejecuta @Valid.
    ============================================================================
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/head :: head('Crear cuenta')}"></th:block>
<body>
<div class="auth-wrap">
    <div class="aur aur-a" style="top:-80px;left:-120px"></div>
    <div class="aur aur-b" style="top:180px;right:-180px"></div>

    <div class="auth-card auth-card-lg">
        <div class="auth-brand">
            <div class="logo-i"><i class="fa-solid fa-layer-group"></i></div>
            <span>NexusAI</span>
        </div>
        <div class="auth-title">Crear cuenta</div>
        <div class="auth-subtitle">Complete sus datos personales para registrarse</div>

        <!-- Mensaje de error general (ej. correo duplicado, claves no coinciden) -->
        <div class="err-msg" style="display:block" th:if="${error}">
            <i class="fa-solid fa-circle-exclamation me-1"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/registro}" th:object="${registroForm}" method="post">

            <div class="auth-row-2">
                <div>
                    <label class="olbl"><i class="fa-regular fa-user me-1"></i>Nombre</label>
                    <input class="oinp" type="text" th:field="*{nombre}" placeholder="Juan">
                    <span class="field-err" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                </div>
                <div>
                    <label class="olbl"><i class="fa-regular fa-user me-1"></i>Apellido</label>
                    <input class="oinp" type="text" th:field="*{apellido}" placeholder="Pérez">
                    <span class="field-err" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
                </div>
            </div>

            <div class="auth-row-2">
                <div>
                    <label class="olbl"><i class="fa-solid fa-id-card me-1"></i>Documento</label>
                    <input class="oinp" type="text" th:field="*{documento}" placeholder="30123456" inputmode="numeric">
                    <span class="field-err" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></span>
                </div>
                <div>
                    <label class="olbl"><i class="fa-regular fa-calendar me-1"></i>Fecha de nacimiento</label>
                    <input class="oinp" type="date" th:field="*{fechaNacimiento}">
                    <span class="field-err" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></span>
                </div>
            </div>

            <label class="olbl"><i class="fa-regular fa-envelope me-1"></i>Correo personal</label>
            <input class="oinp" type="email" th:field="*{correoPersonal}" placeholder="nombre@correo.com" autocomplete="username">
            <span class="field-err" th:if="${#fields.hasErrors('correoPersonal')}" th:errors="*{correoPersonal}"></span>
            <div style="font-size:.74rem;color:var(--tx3);margin:-10px 0 12px">
                Este correo será su usuario para ingresar al sistema.
            </div>

            <div class="auth-row-2">
                <div>
                    <label class="olbl"><i class="fa-solid fa-lock me-1"></i>Clave</label>
                    <input class="oinp" type="password" th:field="*{clave}" placeholder="Mín. 6 caracteres" autocomplete="new-password">
                    <span class="field-err" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></span>
                </div>
                <div>
                    <label class="olbl"><i class="fa-solid fa-lock me-1"></i>Confirmar clave</label>
                    <input class="oinp" type="password" th:field="*{claveConfirmacion}" placeholder="Repita la clave" autocomplete="new-password">
                    <span class="field-err" th:if="${#fields.hasErrors('claveConfirmacion')}" th:errors="*{claveConfirmacion}"></span>
                </div>
            </div>

            <button type="submit" class="bgrd btn w-100 py-3 fw-semibold fs-6 mt-2">
                Crear cuenta <i class="fa-solid fa-arrow-right ms-1 fa-sm"></i>
            </button>
        </form>

        <p class="text-center mt-4" style="font-size:.82rem;color:var(--tx3)">
            ¿Ya tiene una cuenta?
            <a th:href="@{/login}" style="color:var(--pur)">Inicie sesión</a>
        </p>
    </div>
</div>
</body>
</html>
