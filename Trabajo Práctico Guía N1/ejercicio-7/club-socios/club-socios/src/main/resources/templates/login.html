<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: cabecera('Ingresar')}"></head>
<body>

<!-- Vista adaptada de page-login.html de la plantilla Spark Admin -->
<div class="login-wrapper">
    <div class="login-bg-shape login-bg-shape-1"></div>
    <div class="login-bg-shape login-bg-shape-2"></div>

    <div class="login-card">
        <a th:href="@{/login}" class="login-brand text-decoration-none">
            <i class="bi bi-asterisk"></i>
            <span>Club Socios</span>
        </a>
        <p class="login-subtitle">Sistema de control de acceso y cuotas del club</p>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            Sesión cerrada correctamente.
        </div>

        <!-- th:action agrega automáticamente el token CSRF -->
        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
            <div class="login-form-group">
                <label for="username" class="login-form-label">Usuario</label>
                <div class="login-input-group">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" id="username" name="username" class="login-input" placeholder="admin" required autofocus/>
                </div>
            </div>

            <div class="login-form-group">
                <label for="password" class="login-form-label">Contraseña</label>
                <div class="login-input-group">
                    <i class="bi bi-shield-lock input-icon"></i>
                    <input type="password" id="password" name="password" class="login-input login-input-password" placeholder="••••••••" required/>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <span>Ingresar</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <p class="mt-3 text-center text-muted" style="font-size:.8rem">
            Demo: <strong>admin / admin123</strong> (administración) o <strong>recepcion / recepcion123</strong> (control de acceso)
        </p>
    </div>
</div>

<script th:src="@{/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
