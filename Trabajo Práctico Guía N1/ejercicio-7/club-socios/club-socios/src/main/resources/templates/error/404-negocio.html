<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: cabecera('Error')}"></head>
<body>
<div class="login-wrapper">
    <div class="login-card text-center">
        <i class="bi bi-exclamation-triangle" style="font-size:2.5rem;color:#c2410c;"></i>
        <h4 class="mt-3">No se pudo completar la operación</h4>
        <p class="text-muted" th:text="${mensajeError}">Detalle del error</p>
        <a th:href="@{/dashboard}" class="btn-login"><span>Volver al dashboard</span></a>
    </div>
</div>
</body>
</html>
