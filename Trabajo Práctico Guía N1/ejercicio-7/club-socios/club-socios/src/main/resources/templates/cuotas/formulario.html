<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: cabecera('Nueva cuota')}"></head>
<body>

<div th:replace="~{layout/fragments :: sidebar('socios')}"></div>

<div class="main-wrapper">
    <header th:replace="~{layout/fragments :: topbar}"></header>

    <main class="container-fluid p-4">
        <h3 class="mb-1">Nueva cuota</h3>
        <p class="text-muted" th:text="'Grupo familiar: ' + ${grupoFamiliar.nombreGrupo}">Grupo familiar</p>

        <div class="table-card-custom p-4" style="max-width:600px;">
            <form th:action="@{/cuotas}" th:object="${cuota}" method="post" class="row g-3">
                <input type="hidden" th:field="*{grupoFamiliarId}"/>

                <div class="col-md-6">
                    <label class="form-label">Período (AAAA-MM)</label>
                    <input type="month" class="form-control" th:field="*{periodo}"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('periodo')}" th:errors="*{periodo}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Monto total ($)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{montoTotal}"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('montoTotal')}" th:errors="*{montoTotal}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Fecha de vencimiento</label>
                    <input type="date" class="form-control" th:field="*{fechaVencimiento}"/>
                </div>

                <div class="col-12 d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Generar cuota</button>
                    <a th:href="@{/socios/{id}(id=${grupoFamiliar.socioTitularId})}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>

<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
