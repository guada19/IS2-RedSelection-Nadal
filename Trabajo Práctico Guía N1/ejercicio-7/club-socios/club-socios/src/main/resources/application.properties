# =============================================================================
# CONFIGURACION PRINCIPAL - PERFIL POR DEFECTO (MySQL)
# =============================================================================
spring.application.name=club-socios

# ---- Datasource MySQL --------------------------------------------------
# Crear antes la base con:  CREATE DATABASE club_socios CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/club_socios?useSSL=false&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate (ORM) ---------------------------------------------
# ddl-auto=update: Hibernate crea/ajusta las tablas según las entidades.
# En un ambiente productivo se recomienda usar "validate" + migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Thymeleaf (Vista) --------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---- Carga de archivos (foto de rostro) --------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.imagenes.directorio=./imagenes-rostros

# ---- Logging -------------------------------------------------------------
logging.level.com.club.socios=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ---- Configuración simulada del medio de pago Mercado Pago --------------
# (En un caso real irían en variables de entorno / vault, nunca en el repo)
app.pagos.mercadopago.access-token=TEST-ACCESS-TOKEN
app.pagos.mercadopago.modo-simulado=true
