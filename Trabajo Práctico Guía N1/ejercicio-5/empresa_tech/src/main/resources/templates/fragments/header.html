<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header th:fragment="header" class="app-header">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container-fluid">
                <button class="btn btn-link d-lg-none sidebar-toggle" type="button" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>

                <div class="navbar-brand mb-0 h1">Empresa Tech</div>

                <div class="ms-auto d-flex align-items-center gap-3">
                    <span class="text-muted small">Usuario</span>
                    <span class="fw-semibold" sec:authentication="name">admin</span>

                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>
                            Cerrar sesión
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
