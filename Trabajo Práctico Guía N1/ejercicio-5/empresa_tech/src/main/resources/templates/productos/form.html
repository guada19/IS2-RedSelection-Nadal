<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(${id != null ? 'Editar Producto' : 'Nuevo Producto'}, ~{::#producto-form-content})}">
<body>

    <div id="producto-form-content" class="container-fluid px-4 py-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2" th:text="${id != null ? 'Editar Producto' : 'Nuevo Producto'}">Nuevo Producto</h1>
            <a th:href="@{/productos}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Volver al listado
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        <form th:action="${id != null} ? @{/productos/actualizar/{id}(id=${id})} : @{/productos/guardar}"
                              th:object="${producto}"
                              method="post">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre del Producto</label>
                                <input type="text"
                                       class="form-control"
                                       id="nombre"
                                       th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                       placeholder="Ej: Auriculares Bluetooth" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>

                            <!-- Precio Unitario -->
                            <div class="mb-3">
                                <label for="precioUnitario" class="form-label fw-semibold">Precio Unitario ($)</label>
                                <input type="number"
                                       step="0.01"
                                       min="0.01"
                                       class="form-control"
                                       id="precioUnitario"
                                       th:field="*{precioUnitario}"
                                       th:classappend="${#fields.hasErrors('precioUnitario')} ? 'is-invalid' : ''"
                                       placeholder="Ej: 15000.50" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('precioUnitario')}" th:errors="*{precioUnitario}"></div>
                            </div>

                            <!-- Stock Inicial vinculado a cantidadInicial -->
                            <div class="mb-3" th:if="${id == null}">
                                <label for="cantidadInicial" class="form-label fw-semibold">Stock Inicial</label>
                                <input type="number"
                                       min="0"
                                       class="form-control"
                                       id="cantidadInicial"
                                       th:field="*{cantidadInicial}"
                                       th:classappend="${#fields.hasErrors('cantidadInicial')} ? 'is-invalid' : ''"
                                       placeholder="Ej: 50" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidadInicial')}" th:errors="*{cantidadInicial}"></div>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/productos}" class="btn btn-light">Cancelar</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-1"></i> Guardar Producto
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
