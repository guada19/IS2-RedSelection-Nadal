<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:replace="~{fragments/layout :: main-layout('Clientes', ~{::#content})}">
        <div id="content" class="container-fluid px-4 py-4">
            <div th:replace="~{fragments/messages :: messages}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Clientes</h1>
                    <p class="text-muted mb-0">Listado de clientes registrados</p>
                </div>
                <a th:href="@{/clientes/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>
                    Nuevo Cliente
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>DNI</th>
                                    <th>Nombre</th>
                                    <th>Apellido</th>
                                    <th>Teléfono</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cliente : ${clientes}">
                                    <td th:text="${cliente.id}">1</td>
                                    <td th:text="${cliente.dni}">12345678</td>
                                    <td th:text="${cliente.nombre}">Juan</td>
                                    <td th:text="${cliente.apellido}">Pérez</td>
                                    <td th:text="${cliente.telefono != null ? cliente.telefono : '-'}">-</td>
                                    <td class="text-center">
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                            <a href="#" class="btn btn-sm btn-outline-danger delete-btn"
                                               th:attr="data-url=@{/clientes/eliminar/{id}(id=${cliente.id})}, data-name=${cliente.nombre + ' ' + cliente.apellido}">Eliminar</a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.delete-btn').forEach(function (button) {
                button.addEventListener('click', function (event) {
                    event.preventDefault();
                    const url = button.dataset.url;
                    const name = button.dataset.name;
                    if (confirm('¿Desea eliminar al cliente "' + name + '"?')) {
                        window.location.href = url;
                    }
                });
            });
        });
    </script>
</body>
</html>
