<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar sesión | Empresa Tech</title>

    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap-icons/bootstrap-icons.css}"/>
    <link rel="stylesheet" th:href="@{/assets/css/main.css}"/>
</head>
<body class="login-body">
    <div class="container login-container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 login-card">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="login-brand-icon mb-3">
                                <i class="bi bi-cpu"></i>
                            </div>
                            <h2 class="fw-bold mb-1">Empresa Tech</h2>
                            <p class="text-muted mb-0">Sistema de gestión</p>
                        </div>

                        <div th:replace="~{fragments/messages :: messages}"></div>

                        <div th:if="${param.error != null}" class="alert alert-danger" role="alert">
                            <i class="bi bi-x-circle-fill me-2"></i>
                            Usuario o contraseña incorrectos.
                        </div>

                        <div th:if="${param.logout != null}" class="alert alert-success" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            Ha cerrado sesión correctamente.
                        </div>

                        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input id="username" name="username" type="text" class="form-control" placeholder="Ingrese su usuario" required/>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input id="password" name="password" type="password" class="form-control" placeholder="Ingrese su contraseña" required/>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Iniciar sesión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/assets/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
