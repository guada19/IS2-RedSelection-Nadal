<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:replace="~{fragments/layout :: main-layout('Nueva venta', ~{::#content})}">
        <div id="content" class="container-fluid px-4 py-4">
            <div th:replace="~{fragments/messages :: messages}"></div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 pt-4">
                    <h1 class="h3 mb-0">Registrar venta</h1>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/ventas/guardar}" th:object="${factura}" method="post" id="factura-form">
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label" for="idCliente">Cliente</label>
                                <select id="idCliente" class="form-select" th:field="*{idCliente}" required>
                                    <option value="" selected>Seleccione un cliente</option>
                                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre + ' ' + cliente.apellido + ' (' + cliente.dni + ')'}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="table-responsive mb-4">
                            <table class="table table-bordered align-middle" id="detalle-table">
                                <thead class="table-light">
                                    <tr>
                                        <th>Producto</th>
                                        <th>Cantidad</th>
                                        <th>Precio Unitario</th>
                                        <th>Subtotal</th>
                                        <th class="text-center">Acción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="detalle-row" th:each="detalle, iterStat : *{detalles}">
                                        <td>
                                            <select class="form-select producto-select" th:field="*{detalles[__${iterStat.index}__].idProducto}" required>
                                                <option value="" selected>Seleccione producto</option>
                                                <option th:each="producto : ${productos}" th:value="${producto.id}" th:text="${producto.nombre + ' - $' + #numbers.formatDecimal(producto.precioUnitario, 1, 'POINT', 2, 'COMMA')}"></option>
                                            </select>
                                        </td>
                                        <td>
                                            <input type="number" min="1" class="form-control cantidad-input" th:field="*{detalles[__${iterStat.index}__].cantidad}" value="1" required/>
                                        </td>
                                        <td>
                                            <input type="text" class="form-control precio-input" readonly/>
                                        </td>
                                        <td>
                                            <input type="text" class="form-control subtotal-input" readonly/>
                                        </td>
                                        <td class="text-center">
                                            <button type="button" class="btn btn-sm btn-outline-danger remove-row">Eliminar</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <button type="button" class="btn btn-outline-primary" id="add-row-btn">
                                <i class="bi bi-plus-circle me-2"></i>
                                Agregar item
                            </button>

                            <div class="d-flex align-items-center gap-3">
                                <span class="fw-semibold">Total general:</span>
                                <input id="total-general" type="text" class="form-control text-end fw-bold" value="$0.00" readonly style="max-width: 180px;"/>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/ventas}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Registrar venta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script th:inline="javascript">
        const productos = /*[[${productos}]]*/ [];

        function getProductoById(id) {
            return productos.find(producto => Number(producto.id) === Number(id));
        }

        function calcularFila(row) {
            const select = row.querySelector('.producto-select');
            const cantidadInput = row.querySelector('.cantidad-input');
            const precioInput = row.querySelector('.precio-input');
            const subtotalInput = row.querySelector('.subtotal-input');
            const producto = getProductoById(select.value);

            if (!producto) {
                precioInput.value = '';
                subtotalInput.value = '';
                return;
            }

            const precio = Number(producto.precioUnitario);
            const cantidad = Number(cantidadInput.value || 0);
            const subtotal = precio * cantidad;
            precioInput.value = '$' + precio.toFixed(2);
            subtotalInput.value = '$' + subtotal.toFixed(2);
        }

        function recalcularTotal() {
            let total = 0;
            document.querySelectorAll('.detalle-row').forEach(function (row) {
                const subtotalText = row.querySelector('.subtotal-input').value.replace(/[$,]/g, '').trim();
                if (subtotalText) {
                    total += Number(subtotalText);
                }
            });
            document.getElementById('total-general').value = '$' + total.toFixed(2);
        }

        function bindRowEvents(row) {
            row.querySelector('.producto-select').addEventListener('change', function () {
                calcularFila(row);
                recalcularTotal();
            });

            row.querySelector('.cantidad-input').addEventListener('input', function () {
                calcularFila(row);
                recalcularTotal();
            });

            row.querySelector('.remove-row').addEventListener('click', function () {
                if (document.querySelectorAll('.detalle-row').length > 1) {
                    row.remove();
                    recalcularTotal();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.detalle-row').forEach(bindRowEvents);
            document.querySelectorAll('.detalle-row').forEach(calcularFila);
            recalcularTotal();

            document.getElementById('add-row-btn').addEventListener('click', function () {
                const tableBody = document.querySelector('#detalle-table tbody');
                const rows = tableBody.querySelectorAll('.detalle-row');
                const lastRow = rows[rows.length - 1];
                const clone = lastRow.cloneNode(true);

                clone.querySelectorAll('input, select').forEach(function (element) {
                    const name = element.getAttribute('name');
                    if (name) {
                        const match = name.match(/detalles\[(\d+)\]\.(.*)/);
                        if (match) {
                            const newIndex = Number(match[1]) + 1;
                            element.setAttribute('name', name.replace(/\[(\d+)\]/, '[' + newIndex + ']'));
                            element.id = element.id.replace(/_\d+_/, '_' + newIndex + '_');
                        }
                    }
                    if (element.type !== 'button') {
                        element.value = '';
                    }
                });

                tableBody.appendChild(clone);
                bindRowEvents(clone);
                recalcularTotal();
            });
        });
    </script>
</body>
</html>
