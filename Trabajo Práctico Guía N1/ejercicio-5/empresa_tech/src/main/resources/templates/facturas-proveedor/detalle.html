<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:replace="~{fragments/layout :: main-layout('Detalle de compra', ~{::#content})}">
        <div id="content" class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Detalle de compra</h1>
                    <p class="text-muted mb-0" th:text="${factura.nroFactura}">FP-0001</p>
                </div>
                <a th:href="@{/compras}" class="btn btn-outline-secondary">Volver al listado</a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <p class="mb-1 text-muted">Proveedor</p>
                            <h5 class="mb-0" th:text="${factura.proveedorRazonSocial}">Proveedor</h5>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <p class="mb-1 text-muted">Fecha</p>
                            <p class="mb-0 fw-semibold" th:text="${#temporals.format(factura.fecha, 'dd/MM/yyyy')}">01/01/2026</p>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio Unitario</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detalle : ${factura.detalles}">
                                    <td th:text="${detalle.productoNombre}">Producto</td>
                                    <td th:text="${'$'} + ${#numbers.formatDecimal(detalle.precioUnitario, 1, 'POINT', 2, 'COMMA')}">$0.00</td>
                                    <td th:text="${detalle.cantidad}">1</td>
                                    <td th:text="${'$'} + ${#numbers.formatDecimal(detalle.subtotal, 1, 'POINT', 2, 'COMMA')}">$0.00</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-end mt-4">
                        <div class="text-end">
                            <div class="text-muted small">Total</div>
                            <h4 class="mb-0" th:text="${'$'} + ${#numbers.formatDecimal(factura.total, 1, 'POINT', 2, 'COMMA')}">$0.00</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
