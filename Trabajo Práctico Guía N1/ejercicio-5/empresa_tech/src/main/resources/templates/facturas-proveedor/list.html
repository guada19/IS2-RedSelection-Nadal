<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:replace="~{fragments/layout :: main-layout('Compras', ~{::#content})}">
        <div id="content" class="container-fluid px-4 py-4">
            <div th:replace="~{fragments/messages :: messages}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Compras</h1>
                    <p class="text-muted mb-0">Historial de facturas de proveedores</p>
                </div>
                <a th:href="@{/compras/nueva}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>
                    Nueva compra
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Número</th>
                                    <th>Proveedor</th>
                                    <th>Fecha</th>
                                    <th>Total</th>
                                    <th>Estado</th>
                                    <th class="text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="factura : ${compras}">
                                    <td th:text="${factura.id}">1</td>
                                    <td th:text="${factura.nroFactura}">FP-001</td>
                                    <td th:text="${factura.proveedorRazonSocial}">Proveedor</td>
                                    <td th:text="${#temporals.format(factura.fecha, 'dd/MM/yyyy')}">01/01/2026</td>
                                    <td th:text="${'$'} + ${#numbers.formatDecimal(factura.total, 1, 'POINT', 2, 'COMMA')}">$0.00</td>
                                    <td>
                                        <span class="badge rounded-pill" th:classappend="${factura.estado.name() == 'PAGADA'} ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'"
                                              th:text="${factura.estado}">PENDIENTE</span>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/compras/detalle/{id}(id=${factura.id})}" class="btn btn-sm btn-outline-primary">Ver detalle</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
