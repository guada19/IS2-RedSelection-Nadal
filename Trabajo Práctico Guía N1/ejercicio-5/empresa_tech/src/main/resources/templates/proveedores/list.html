<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:replace="~{fragments/layout :: main-layout('Proveedores', ~{::#content})}">
        <div id="content" class="container-fluid px-4 py-4">
            <div th:replace="~{fragments/messages :: messages}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Proveedores</h1>
                    <p class="text-muted mb-0">Listado de proveedores activos</p>
                </div>
                <a th:href="@{/proveedores/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>
                    Nuevo Proveedor
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>CUIT</th>
                                    <th>Razón Social</th>
                                    <th>Teléfono</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="proveedor : ${proveedores}">
                                    <td th:text="${proveedor.id}">1</td>
                                    <td th:text="${proveedor.cuit}">20-12345678-9</td>
                                    <td th:text="${proveedor.razonSocial}">Empresa S.A.</td>
                                    <td th:text="${proveedor.telefono != null ? proveedor.telefono : '-'}">-</td>
                                    <td class="text-center">
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/proveedores/editar/{id}(id=${proveedor.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                            <a href="#" class="btn btn-sm btn-outline-danger delete-btn"
                                               th:attr="data-url=@{/proveedores/eliminar/{id}(id=${proveedor.id})}, data-name=${proveedor.razonSocial}">Eliminar</a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.delete-btn').forEach(function (button) {
                button.addEventListener('click', function (event) {
                    event.preventDefault();
                    const url = button.dataset.url;
                    const name = button.dataset.name;
                    if (confirm('¿Desea eliminar al proveedor "' + name + '"?')) {
                        window.location.href = url;
                    }
                });
            });
        });
    </script>
</body>
</html>
