####################################################################################
# application.properties
# Configuracion central de la aplicacion (capa de infraestructura).
# Spring Boot lee este archivo al arrancar y configura automaticamente:
#   - La conexion a la base de datos MySQL (DataSource)
#   - Hibernate / JPA (ORM)
#   - El servidor de correo (envio de mail de bienvenida)
#   - Thymeleaf (capa de vistas)
####################################################################################

spring.application.name=colegio-spark

# ------------------------------------------------------------------------------
# Servidor embebido (Tomcat)
# ------------------------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------------------------
# DATASOURCE - Conexion a MySQL
# Reemplazar host/puerto/usuario/clave segun el ambiente. Se recomienda NO dejar
# credenciales reales en este archivo en un proyecto real: usar variables de
# entorno (ver README.md, seccion "Configuracion").
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/colegio_db?useSSL=false&serverTimezone=America/Argentina/Mendoza&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / HIBERNATE (capa ORM)
# ddl-auto=update -> Hibernate crea/actualiza automaticamente las tablas a partir
#   de las entidades anotadas con @Entity. Comodo para el desarrollo/TP; en un
#   ambiente productivo se recomienda usar migraciones versionadas (Flyway/Liquibase)
#   y dejar ddl-auto=validate.
# show-sql=true -> imprime en consola el SQL generado por Hibernate (fines didacticos)
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# THYMELEAF (capa View)
# cache=false -> util en desarrollo para ver los cambios de las plantillas sin
#   tener que reiniciar la aplicacion.
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------------------------
# CORREO (envio del mail de bienvenida al docente al registrarse)
# Ejemplo de configuracion para Gmail usando una "contraseña de aplicacion".
# Las credenciales se leen de variables de entorno para no exponerlas en el
# codigo fuente (MAIL_USERNAME / MAIL_PASSWORD).
# ------------------------------------------------------------------------------
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=${MAIL_USERNAME:colegio.spark.demo@gmail.com}
#spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.host=smtp.ethereal.email
spring.mail.port=587
spring.mail.username=max.feil@ethereal.email
spring.mail.password=ZXCsDCVcV5NSJydjUh
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Si es true, un fallo real de conexion SMTP no interrumpe el registro del
# docente (el error queda registrado en el log). Ver EmailServiceImpl.
app.mail.fallar-silenciosamente=true
app.mail.remitente=colegio.spark.demo@gmail.com

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.colegio.spark=DEBUG

# ------------------------------------------------------------------------------
# Multipart (no se usa carga de archivos en este TP, se deja el valor por defecto)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
