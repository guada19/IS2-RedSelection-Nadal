<!--
  ============================================================================
  perfil/ver.html                (capa View - Thymeleaf)
  ============================================================================
  Muestra los datos personales del docente autenticado. El Model recibe un
  UNICO atributo "docente" de tipo DocenteResponseDTO (nunca la entidad JPA
  Docente ni, mucho menos, el hash de la contraseña).
  ============================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Mi perfil')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('perfil')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title">Mi perfil</h1>
            <p class="page-subtitle">Tus datos personales registrados en el sistema.</p>
        </div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/panel}" class="text-decoration-none text-muted-green">Inicio</a></li>
                <li class="breadcrumb-item active text-main" aria-current="page">Mi perfil</li>
            </ol>
        </nav>
    </div>

    <div class="p-3">
        <div class="table-card-custom p-4" style="max-width: 640px;">
            <dl class="row mb-0">
                <dt class="col-sm-4">Nombre</dt>
                <dd class="col-sm-8" th:text="${docente.nombre}"></dd>

                <dt class="col-sm-4">Apellido</dt>
                <dd class="col-sm-8" th:text="${docente.apellido}"></dd>

                <dt class="col-sm-4">Sexo</dt>
                <dd class="col-sm-8" th:text="${docente.sexo}"></dd>

                <dt class="col-sm-4">Fecha de nacimiento</dt>
                <dd class="col-sm-8" th:text="${#temporals.format(docente.fechaNacimiento, 'dd/MM/yyyy')}"></dd>

                <dt class="col-sm-4">Correo (usuario)</dt>
                <dd class="col-sm-8" th:text="${docente.email}"></dd>

                <dt class="col-sm-4">Rol</dt>
                <dd class="col-sm-8" th:text="${docente.rol}"></dd>
            </dl>
            <a th:href="@{/perfil/password}" class="btn-table-action mt-3"><i class="bi bi-key"></i> Cambiar mi contraseña</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
