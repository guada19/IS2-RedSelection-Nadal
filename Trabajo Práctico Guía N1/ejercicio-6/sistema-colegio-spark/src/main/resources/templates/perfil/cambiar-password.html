<!--
  ============================================================================
  perfil/cambiar-password.html   (capa View - Thymeleaf)
  ============================================================================
  Formulario de cambio de contraseña del docente autenticado (requisito
  explicito de la consigna). Envia un CambioPasswordDTO por POST a
  /perfil/password (ver PerfilController.cambiarPassword).
  ============================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Cambiar contraseña')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('password')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title">Cambiar contraseña</h1>
            <p class="page-subtitle">Por seguridad, debes confirmar tu contraseña actual.</p>
        </div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/panel}" class="text-decoration-none text-muted-green">Inicio</a></li>
                <li class="breadcrumb-item active text-main" aria-current="page">Cambiar contraseña</li>
            </ol>
        </nav>
    </div>

    <div class="p-3">
        <div class="table-card-custom p-4" style="max-width: 560px;">

            <div class="alert alert-danger" th:if="${errorPasswordActual}" th:text="${errorPasswordActual}"></div>
            <div class="alert alert-danger" th:if="${errorConfirmacion}" th:text="${errorConfirmacion}"></div>

            <form th:action="@{/perfil/password}" th:object="${cambioPasswordDTO}" method="post">

                <div class="mb-3">
                    <label class="form-label-custom" for="passwordActual">Contraseña actual</label>
                    <input type="password" id="passwordActual" th:field="*{passwordActual}" class="form-control-custom"/>
                    <div class="form-feedback-custom invalid-custom" th:if="${#fields.hasErrors('passwordActual')}" th:errors="*{passwordActual}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label-custom" for="passwordNueva">Nueva contraseña</label>
                    <input type="password" id="passwordNueva" th:field="*{passwordNueva}" class="form-control-custom"/>
                    <div class="form-feedback-custom invalid-custom" th:if="${#fields.hasErrors('passwordNueva')}" th:errors="*{passwordNueva}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label-custom" for="confirmarPasswordNueva">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmarPasswordNueva" th:field="*{confirmarPasswordNueva}" class="form-control-custom"/>
                    <div class="form-feedback-custom invalid-custom" th:if="${#fields.hasErrors('confirmarPasswordNueva')}" th:errors="*{confirmarPasswordNueva}"></div>
                </div>

                <button type="submit" class="btn-table-action"><i class="bi bi-check-lg"></i> Actualizar contraseña</button>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
