<!--
  ============================================================================
  grados/listar.html             (capa View - Thymeleaf)
  ============================================================================
  Listado de Grados. Recorre con th:each la lista de GradoResponseDTO que
  GradoController#listar coloca en el Model. El boton "Eliminar" envia un
  POST (no un simple <a href>) porque una eliminacion es una operacion que
  modifica el servidor y, ademas, asi viaja automaticamente el token CSRF
  que Thymeleaf inserta en todo <form>.
  ============================================================================
-->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Grados')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('grados')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title">Grados</h1>
            <p class="page-subtitle">Grados/años escolares del colegio.</p>
        </div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/panel}" class="text-decoration-none text-muted-green">Inicio</a></li>
                <li class="breadcrumb-item active text-main" aria-current="page">Grados</li>
            </ol>
        </nav>
    </div>

    <div class="table-card-custom">
        <div class="table-header-control">
            <a th:href="@{/grados/nuevo}" class="btn-table-action"><i class="bi bi-plus-lg"></i> Nuevo grado</a>
        </div>

        <div class="alert alert-success m-3" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>

        <div class="table-responsive">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Nivel</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="grado : ${grados}">
                    <td th:text="${grado.nombre}"></td>
                    <td th:text="${grado.nivel}"></td>
                    <td class="text-center">
                        <a th:href="@{/grados/{id}/editar(id=${grado.id})}" class="btn-table-action"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/grados/{id}/eliminar(id=${grado.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este grado?');">
                            <button type="submit" class="btn-table-action text-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(grados)}">
                    <td colspan="3" class="text-center text-muted-green">No hay grados registrados todavia.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
