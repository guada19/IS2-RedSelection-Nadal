<!-- alumnos/listar.html (capa View - Thymeleaf) -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Alumnos')}"></head>
<body>

<div th:replace="~{fragments/layout :: sidebar('alumnos')}"></div>

<div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar}"></div>

    <div class="page-header">
        <div>
            <h1 class="page-title">Alumnos</h1>
            <p class="page-subtitle">Alumnos registrados, con su grado y aula.</p>
        </div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/panel}" class="text-decoration-none text-muted-green">Inicio</a></li>
                <li class="breadcrumb-item active text-main" aria-current="page">Alumnos</li>
            </ol>
        </nav>
    </div>

    <div class="table-card-custom">
        <div class="table-header-control">
            <a th:href="@{/alumnos/nuevo}" class="btn-table-action"><i class="bi bi-plus-lg"></i> Nuevo alumno</a>
        </div>

        <div class="alert alert-success m-3" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>

        <div class="table-responsive">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Apellido y Nombre</th>
                    <th>DNI</th>
                    <th>Fecha Nac.</th>
                    <th>Grado</th>
                    <th>Aula</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="alumno : ${alumnos}">
                    <td th:text="${alumno.apellido + ', ' + alumno.nombre}"></td>
                    <td th:text="${alumno.dni}"></td>
                    <td th:text="${#temporals.format(alumno.fechaNacimiento, 'dd/MM/yyyy')}"></td>
                    <td th:text="${alumno.gradoNombre}"></td>
                    <td th:text="${alumno.aulaNombre}"></td>
                    <td class="text-center">
                        <a th:href="@{/alumnos/{id}/editar(id=${alumno.id})}" class="btn-table-action"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/alumnos/{id}/eliminar(id=${alumno.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este alumno?');">
                            <button type="submit" class="btn-table-action text-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(alumnos)}">
                    <td colspan="6" class="text-center text-muted-green">No hay alumnos registrados todavia.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
